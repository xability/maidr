name: Mermaid Latest Check

# Weekly run of the Mermaid adapter's e2e spec against the newest Mermaid and
# ZenUML plugin on npm, rather than the versions package-lock.json pins.
#
# The adapter reads Mermaid's internal diagram databases through guarded
# getters, so a Mermaid release that renames or reshapes one does not throw:
# the diagram is read with fewer details, or not at all, and nothing that runs
# on a pull request notices, because every PR tests the locked version. This
# job is the one place a breaking release shows up. On failure it opens an
# issue (or comments on the open one) naming the versions it tested.
#
# mermaid.spec.ts serves every jsDelivr request for either package from
# node_modules whatever version the page names, so installing the newest here
# is all it takes for the example pages to run against it.

on:
  schedule:
    # Off the hour on purpose: minute 0 is the busiest slot on GitHub's
    # scheduler, and scheduled runs queued there are routinely delayed.
    - cron: '17 7 * * 1' # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-mermaid-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-save leaves package.json and the lockfile alone. --force because
      # the ZenUML plugin's peer range names the Mermaid majors it was published
      # against, so the release this job exists to try -- a new major -- would
      # otherwise be refused before the spec could say anything. Not
      # --legacy-peer-deps: on this tree it removes the packages npm ci
      # installed as peers, rollup and playwright-core among them.
      - name: Install the newest Mermaid and ZenUML plugin
        id: latest
        run: |
          npm install --no-save --force mermaid@latest @mermaid-js/mermaid-zenuml@latest
          echo "mermaid=$(node -p "require('mermaid/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "zenuml=$(node -p "require('@mermaid-js/mermaid-zenuml/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # mermaid.spec.ts loads dist/maidr.js and dist/mermaid.js, and the
      # example pages fetch a locale pack from beside maidr.js.
      - name: Build core bundle, locale packs and the Mermaid adapter
        run: node scripts/build.js core locales mermaid

      # continue-on-error so the issue step below gets the output; the last
      # step re-raises the failure.
      - name: Run the Mermaid e2e spec
        id: e2e
        continue-on-error: true
        # pipefail is set explicitly; make the shell explicit too.
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --config=e2e_tests/config/test-config.ts --project=chromium e2e_tests/specs/mermaid.spec.ts 2>&1 | tee report.txt
        env:
          CI: true

      - name: Upload Playwright report
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-latest-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # failure() covers an install or build that failed before the spec ran;
      # the outcome covers the spec, whose continue-on-error masks failure().
      - name: Open or update the compatibility issue
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          MERMAID_VERSION: ${{ steps.latest.outputs.mermaid }}
          ZENUML_VERSION: ${{ steps.latest.outputs.zenuml }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const mermaid = process.env.MERMAID_VERSION || 'unknown (the install failed)';
            const zenuml = process.env.ZENUML_VERSION || 'unknown';
            let report = 'The spec did not run; see the workflow run for the step that failed.';
            if (fs.existsSync('report.txt')) {
              // The tail carries the failures and the summary; the whole log is
              // in the run.
              report = fs.readFileSync('report.txt', 'utf8').trim().split('\n').slice(-80).join('\n');
            }
            const title = `chore(mermaid): the Mermaid adapter fails against mermaid@${mermaid}`;
            const body = [
              `The weekly Mermaid check failed against **mermaid@${mermaid}** and`,
              `**@mermaid-js/mermaid-zenuml@${zenuml}**, the newest on npm.`,
              '',
              'The adapter reads Mermaid\'s internal diagram databases, which a',
              'Mermaid release may change without notice. Reproduce with',
              '`npm install --no-save --force mermaid@latest @mermaid-js/mermaid-zenuml@latest`,',
              '`node scripts/build.js core locales mermaid` and',
              '`e2e_tests/specs/mermaid.spec.ts`, then fix the reader under',
              '`src/adapters/mermaid/diagrams/` before raising the pin in',
              '`package.json` and the examples.',
              '',
              `Run: ${process.env.RUN_URL}`,
              '',
              '```',
              report,
              '```',
              '',
              '_Generated by `.github/workflows/mermaid-latest-check.yml`._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mermaid-latest',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mermaid-latest', 'maintenance'],
              });
            }

      - name: Fail when the spec failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
