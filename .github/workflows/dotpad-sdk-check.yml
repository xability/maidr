name: DotPad SDK Check

# Weekly check that the DotPad SDK release pinned in
# src/service/dotPadSdk.json is still the one the vendor names as current in
# dotincorp/dotpad-sdk-guide. When the vendor has moved on, an issue is opened
# (or updated) with the two commands that move the pin.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-dotpad-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare the pin with the vendor's current release
        id: check
        # PIPESTATUS below is bash-specific; make the shell explicit.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/repin-dotpad-sdk.mjs --check 2>&1 | tee report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the release issue
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'chore: a newer DotPad SDK release is available';
            const body = [
              'The weekly DotPad SDK check found that the vendor names a Web SDK',
              'release newer than the one pinned in `src/service/dotPadSdk.json`.',
              'Moving the pin is described in `docs/TACTILE_DISPLAY.md` under',
              '"The SDK"; the report below names the commands.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '_Generated by `.github/workflows/dotpad-sdk-check.yml`._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dotpad-sdk',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dotpad-sdk', 'maintenance'],
              });
            }

      - name: Fail when the pin is behind
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
