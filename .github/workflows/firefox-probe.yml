# Temporary: runs the whole e2e suite in WebKit and Firefox on a work branch. Not to be merged.
name: Firefox e2e probe

on:
  push:
    branches: [ci/firefox-e2e-probe]

permissions:
  contents: read

jobs:
  browsers:
    name: WebKit and Firefox, every spec
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run build
      - run: npm run build:nivo-example
      - run: npm run build:mui-x-charts-example
      - name: webkit
        continue-on-error: true
        run: npx playwright test --config=e2e_tests/config/test-config.ts --project=webkit --reporter=github,dot
        env: { CI: true }
      - name: firefox
        continue-on-error: true
        run: npx playwright test --config=e2e_tests/config/test-config.ts --project=firefox --reporter=github,dot
        env: { CI: true }
