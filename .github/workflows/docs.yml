name: Deploy Documentation

on:
  push:
    branches:
      - main
      - docs/jsdoc #testing
    paths:
      - 'src/**'
      - 'README.md'
      - 'typedoc.json'
      - 'package.json'
      - 'docs/**'
      - 'examples/**'
      - 'media/**'
      - 'scripts/build-site.js'
      - 'scripts/markdown.js'
      - 'scripts/examplesGallery.js'
      - 'scripts/typedoc-seo-plugin.mjs'
      - 'scripts/add-navbar-to-typedoc.js'
      - 'scripts/check-page-sizes.js'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

  # The semantic-release commit is "chore(release): X [skip ci]", which GitHub
  # never runs `on: push` workflows for, so the site did not pick up a new
  # version until the next push that touched a docs path. Rebuild when the
  # Release workflow finishes instead; the job below skips a failed release.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: scripts/build-site.js derives sitemap <lastmod> and
          # TechArticle dates from git commit dates.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build documentation site
        run: npm run docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # The Pages backend occasionally hard-fails a deployment with
        # "Deployment failed, try again later." (e.g. main run 28695930130);
        # deploy-pages does not retry that itself, so retry once after a
        # short backoff before failing the workflow.
        continue-on-error: true

      - name: Wait before retrying failed deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
