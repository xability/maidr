name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
      contents: read

jobs:
  # Copilot's instruction files under .github/ are generated from CLAUDE.md and
  # .claude/rules/, so an edit to one side must be regenerated into the other.
  # The check is pure Node with no dependencies, so it skips npm ci and gates
  # nothing — it reports drift on its own rather than blocking the real jobs.
  copilot-sync:
    name: Copilot Instructions In Sync
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Check generated instruction files
        run: npm run sync:copilot:check

  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures commit history is pulled

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Commitlint
        run: npm run commitlint --verbose

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  # Playwright on every PR: chromium only, core bundle only. The whole
  # chromium suite is green, so it all runs here — a subset let the specs rot
  # for two months while PRs stayed green (see issue #626). The other two
  # browsers stay on the scheduled e2e workflows.
  e2e-smoke:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    needs: [commitlint, lint]
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build core bundle
        run: node scripts/build.js core

      - name: Run e2e specs
        id: smoke
        run: npx playwright test --config=e2e_tests/config/test-config.ts --project=chromium
        env:
          CI: true

      # The chromium suite is kept green, so a failure here is a real
      # regression — ship the report and screenshots with the PR run.
      # Scoped to the test step so an earlier failure (npm ci, browser
      # install) doesn't trigger an upload with nothing to upload.
      - name: Upload Playwright report on failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [commitlint, lint]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [commitlint, lint]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [commitlint, lint]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  # Mirrors the build steps of the Deploy Documentation workflow (docs.yml),
  # which otherwise only runs on pushes to main — so docs/example-app build
  # breakage surfaces on the PR instead of after merge.
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: [commitlint, lint]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build documentation site
        run: npm run docs
