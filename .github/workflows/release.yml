name: Release

on:
  schedule:
    # Every Monday at 15:00 UTC = 9 AM CST (winter) / 10 AM CDT (summer).
    # GitHub Actions cron runs in UTC and does not observe DST.
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    permissions:
      contents: write # Needed for GitHub release
      issues: write # Needed for release notes
      pull-requests: write # Needed for release notes
      id-token: write # Needed for NPM provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Clean dependencies and npm config
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          rm -f ~/.npmrc
          npm config delete always-auth || true
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures

      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          npx semantic-release
          # The tag semantic-release just created, when it created one. Also
          # captured as the version so the downstream notification below can
          # name it, rather than making the receiver guess from `latest`.
          if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing
        if: steps.semantic-release.outputs.new_release == 'true'
        run: npm publish --access public --provenance

      # Both language bindings ship a copy of this package's built bundle and
      # refresh it from npm, and so does maidr-skill (the agent skill). Left
      # to themselves they discover a release on their own cadence, so a fix
      # can sit unread for a day or longer. Telling them directly closes that
      # gap to minutes.
      #
      # What each does with the news is its own call, not this workflow's.
      # r-maidr commits the refreshed bundle to `main`, and `main` is what it
      # ships, because CRAN submissions are manual. py-maidr also commits to
      # `main`, but as a `chore:`, which by design does not cut a PyPI
      # release: its release workflow re-resolves upstream when a release is
      # actually cut, so the news reaches its users then rather than now.
      # maidr-skill commits the refreshed bundle and its version pins to
      # `main`, which is what installed copies update from.
      #
      # The three steps below are each continue-on-error, because the release
      # is the thing that matters here. A missed ping costs a receiver some
      # currency -- each keeps its own refresh path as the backstop -- whereas
      # a red release job invites a re-run of a publish that already happened.
      # A miss is not silent, though: the step after them files an issue.

      # The receivers fetch the release from the registry, so announcing it
      # before the registry serves it would just make them fail, and the
      # publish step returning no longer means that. npm now serves a release
      # minutes after accepting it -- 4.9.0 about ten minutes after that step
      # ended, 4.11.0 eighteen -- and on 4.11.0 r-maidr and py-maidr, which
      # retry for fifteen minutes, both gave up before it appeared. So wait
      # until it does: every 30 s for up to an hour, over three times the
      # longest lag seen. Past that something upstream is wrong, and no one
      # is sent after a version that is not there. The loop is a module so
      # that test/scripts/waitForNpmVersion.test.ts can reach it (#694).
      - name: Wait for npm to serve the release
        id: registry
        if: steps.semantic-release.outputs.new_release == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          node scripts/ci/waitForNpmVersion.cjs maidr "${VERSION}"

      # The token comes from the maidr-release-dispatch GitHub App, owned by
      # xability and installed on the three receivers only, with Contents:
      # read and write, which a repository dispatch needs. A token lives an
      # hour, and the wait above can take one, so it is minted after the wait
      # rather than before. The app replaced a fine-grained personal token,
      # which the University of Illinois enterprise caps at 366 days and which
      # did not list maidr-skill when 4.11.0 went out; an app key does not
      # expire. Its client ID and key are the DOWNSTREAM_APP_CLIENT_ID variable
      # and DOWNSTREAM_APP_PRIVATE_KEY secret of this job's NPM_TOKEN
      # environment. `client-id` is the input v3.1.0 added and the action's
      # README uses; actionlint 1.7.12's bundled metadata predates it and
      # reports it as unknown, which is that data being stale, not this step.
      - name: Mint a token for the downstream repositories
        id: dispatch-token
        if: steps.registry.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOWNSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_APP_PRIVATE_KEY }}
          owner: xability
          repositories: r-maidr,py-maidr,maidr-skill

      - name: Tell the language bindings the new version is on npm
        id: notify
        if: steps.dispatch-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          # jq builds the body so the version reaches JSON as data rather
          # than as text spliced into a quoted string.
          BODY=$(jq -n --arg version "$VERSION" \
            '{event_type: "maidr-released", client_payload: {version: $version}}')

          # Each receiver is notified independently. Looping with the whole run
          # gated on the first call would let one repository being unreachable
          # decide whether the others ever hear about the release, which is
          # exactly the coupling this step exists to avoid.
          missed=()
          reasons=()
          for repo in xability/r-maidr xability/py-maidr xability/maidr-skill; do
            if out=$(printf '%s' "$BODY" | gh api "repos/$repo/dispatches" --input - 2>&1); then
              echo "Notified $repo of v${VERSION}."
            else
              echo "Could not notify $repo of v${VERSION}: $out"
              missed+=("$repo")
              reasons+=("$repo: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)")
            fi
          done

          # Which repositories missed out, and GitHub's reason for each, for
          # the issue the next step files.
          if [ "${#missed[@]}" -gt 0 ]; then
            echo "missed=${missed[*]}" >> "$GITHUB_OUTPUT"
            {
              echo 'reasons<<REASONS'
              printf '%s\n' "${reasons[@]}"
              echo 'REASONS'
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # A miss must not fail the release, but it must not pass unnoticed
      # either, as 4.11.0's did behind a green run. So when any of the three
      # steps above failed, file an issue, or comment on the one already open
      # for this release; scripts/ci/releaseNotifyIssue.cjs has the wording.
      # No continue-on-error here: if even the issue cannot be filed, a red
      # run is the one signal left.
      - name: Open an issue when the downstream repositories were not told
        if: steps.registry.outcome == 'failure' || steps.dispatch-token.outcome == 'failure' || steps.notify.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.semantic-release.outputs.version }}
          FAILURE: ${{ steps.registry.outcome == 'failure' && 'registry' || steps.dispatch-token.outcome == 'failure' && 'token' || 'dispatch' }}
          MISSED: ${{ steps.notify.outputs.missed }}
          REASONS: ${{ steps.notify.outputs.reasons }}
        with:
          script: |
            const { notifyIssue } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/releaseNotifyIssue.cjs`);
            await notifyIssue({ github, context, core });

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/
          retention-days: 7

