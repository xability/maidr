<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid Pie Chart - MAIDR Example</title>
    <!-- Mermaid 12.2.0. The adapter reads Mermaid's own parse of the text, so
         a newer Mermaid works as long as its diagram databases keep their
         shape; verify the examples when upgrading. -->
    <script
      src="https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js"
      integrity="sha384-8xUhuLNMjW/cI2Dacg3DR4WliYznvIg0LVG1stctThKD/YVrJFI9TNCFxft5NYgp"
      crossorigin="anonymous"
    ></script>
    <!-- MAIDR core + Mermaid adapter -->
    <script src="../../dist/maidr.js"></script>
    <script src="../../dist/mermaid.js"></script>
  </head>

  <body>
    <main>
      <h1>Mermaid Pie Chart with MAIDR</h1>
      <p>Left and right walk the slices; each announces its value and share of the whole.</p>
      <p id="error" hidden>
        Failed to load Mermaid from CDN. Please check your internet connection.
      </p>
      <pre class="mermaid" id="diagram">
pie title Pets adopted by volunteers
  "Dogs" : 386
  "Cats" : 85
  "Rabbits" : 42
  "Birds" : 15
      </pre>
    </main>

    <script>
      // Render with startOnLoad off, so the adapter can read each diagram's
      // text before Mermaid replaces it with the drawing; bindMermaid then
      // renders it and makes it accessible.
      if (typeof mermaid === 'undefined') {
        document.getElementById('error').hidden = false;
      } else {
        mermaid.initialize({ startOnLoad: false });
        maidrMermaid.bindMermaid(mermaid);
      }
    </script>
  </body>
</html>
