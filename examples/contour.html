      <!--
        A contour plot draws a scalar field as curves of constant value.
        Structurally that is one line per level, which is why navigation,
        braille and highlighting come from the line trace unchanged: walking a
        row walks one iso-value curve.

        What a line layer cannot say is the two things this chart is read for.

        THE LEVEL is a value of the field, not a name for the curve. Read as a
        line, a contour tells you where a curve runs and never what value it
        runs at -- the first thing anyone asks.

        SPACING is the gradient. How densely the curves are drawn is the visual
        cue for how steeply the field changes, and it is the one thing a reader
        walking a single curve can never assemble, because a curve says nothing
        about its neighbours. Each point announces the distance to the nearest
        point on the adjacent level: tight is a cliff, wide is a plateau.

        The lattice underneath is a heatmap and MAIDR already reads one. This
        is the reading that makes the chart legible rather than the cheap
        fallback.
      -->
