<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>MAIDR Survival Curve Example — Overall Survival</title>
</head>

<body>
  <div>
    <link rel="stylesheet" href="../dist/maidr.css" />
    <script type="text/javascript" src="../dist/maidr.js"></script>
    <div>
      <!--
        A Kaplan-Meier curve is a step function: survival holds until an event
        drops it. The step chart covers that. What a survival figure adds is
        the two things it is actually read for.

        MEDIAN SURVIVAL is the number a survival analysis is quoted by.
        Control reaches half at month 9; Treatment never does, and "not
        reached" is the result -- more than half its subjects were still alive
        at the end of follow-up -- rather than a number that went missing.

        CENSORING is not an event. The ticks mark subjects who left the study
        without the event happening, and the curve does NOT step there:
        Treatment holds at 0.79 across months 9 and 12. Nothing else in the
        announcement separates that from a month in which nothing happened,
        which is why the trace says it. A flat tail carried by many subjects
        and one carried by three look identical and mean different things.

        The risk table a published figure prints under the axis is
        deliberately absent: it is a second set of numbers on a second axis,
        and belongs in a companion layer rather than folded into the curve.
      -->
      <svg xmlns="http://www.w3.org/2000/svg" width="760pt" height="360pt" viewBox="0 0 760 360" version="1.1"
        id="survival-overall" maidr='{&#10;  &quot;id&quot;: &quot;survival-overall&quot;,&#10;  &quot;subplots&quot;: [&#10;    [&#10;      {&#10;        &quot;id&quot;: &quot;survival-overall-subplot&quot;,&#10;        &quot;layers&quot;: [&#10;          {&#10;            &quot;id&quot;: &quot;survival-overall-layer&quot;,&#10;            &quot;type&quot;: &quot;survival&quot;,&#10;            &quot;title&quot;: &quot;Overall Survival&quot;,&#10;            &quot;axes&quot;: {&#10;              &quot;x&quot;: {&#10;                &quot;label&quot;: &quot;Months&quot;&#10;              },&#10;              &quot;y&quot;: {&#10;                &quot;label&quot;: &quot;Survival probability&quot;&#10;              },&#10;              &quot;z&quot;: {&#10;                &quot;label&quot;: &quot;Arm&quot;&#10;              }&#10;            },&#10;            &quot;selectors&quot;: [&#10;              &quot;g[id=&#x27;km-control&#x27;] &gt; path&quot;,&#10;              &quot;g[id=&#x27;km-treatment&#x27;] &gt; path&quot;&#10;            ],&#10;            &quot;data&quot;: [&#10;              [&#10;                {&#10;                  &quot;x&quot;: 0,&#10;                  &quot;y&quot;: 1.0,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.88,&#10;                  &quot;yMax&quot;: 1.0&#10;                },&#10;                {&#10;                  &quot;x&quot;: 3,&#10;                  &quot;y&quot;: 0.88,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.76,&#10;                  &quot;yMax&quot;: 1.0&#10;                },&#10;                {&#10;                  &quot;x&quot;: 6,&#10;                  &quot;y&quot;: 0.71,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.59,&#10;                  &quot;yMax&quot;: 0.83&#10;                },&#10;                {&#10;                  &quot;x&quot;: 9,&#10;                  &quot;y&quot;: 0.5,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.38,&#10;                  &quot;yMax&quot;: 0.62&#10;                },&#10;                {&#10;                  &quot;x&quot;: 12,&#10;                  &quot;y&quot;: 0.41,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.29,&#10;                  &quot;yMax&quot;: 0.53&#10;                },&#10;                {&#10;                  &quot;x&quot;: 15,&#10;                  &quot;y&quot;: 0.34,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.22,&#10;                  &quot;yMax&quot;: 0.46,&#10;                  &quot;censored&quot;: true&#10;                },&#10;                {&#10;                  &quot;x&quot;: 18,&#10;                  &quot;y&quot;: 0.29,&#10;                  &quot;z&quot;: &quot;Control&quot;,&#10;                  &quot;yMin&quot;: 0.17,&#10;                  &quot;yMax&quot;: 0.41&#10;                }&#10;              ],&#10;              [&#10;                {&#10;                  &quot;x&quot;: 0,&#10;                  &quot;y&quot;: 1.0,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.9,&#10;                  &quot;yMax&quot;: 1.0&#10;                },&#10;                {&#10;                  &quot;x&quot;: 3,&#10;                  &quot;y&quot;: 0.95,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.85,&#10;                  &quot;yMax&quot;: 1.0&#10;                },&#10;                {&#10;                  &quot;x&quot;: 6,&#10;                  &quot;y&quot;: 0.86,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.76,&#10;                  &quot;yMax&quot;: 0.96&#10;                },&#10;                {&#10;                  &quot;x&quot;: 9,&#10;                  &quot;y&quot;: 0.79,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.69,&#10;                  &quot;yMax&quot;: 0.89&#10;                },&#10;                {&#10;                  &quot;x&quot;: 12,&#10;                  &quot;y&quot;: 0.79,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.69,&#10;                  &quot;yMax&quot;: 0.89,&#10;                  &quot;censored&quot;: true&#10;                },&#10;                {&#10;                  &quot;x&quot;: 15,&#10;                  &quot;y&quot;: 0.72,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.62,&#10;                  &quot;yMax&quot;: 0.82&#10;                },&#10;                {&#10;                  &quot;x&quot;: 18,&#10;                  &quot;y&quot;: 0.68,&#10;                  &quot;z&quot;: &quot;Treatment&quot;,&#10;                  &quot;yMin&quot;: 0.58,&#10;                  &quot;yMax&quot;: 0.78,&#10;                  &quot;censored&quot;: true&#10;                }&#10;              ]&#10;            ]&#10;          }&#10;        ]&#10;      }&#10;    ]&#10;  ]&#10;}'>
        <g id="figure_1">
          <g id="figure-background">
            <path d="M 0 360  L 760 360  L 760 0  L 0 0  z " style="fill: #ffffff" />
          </g>
          <g id="axes_1">
            <line x1="110" y1="190.0" x2="650.0" y2="190.0"
              style="stroke: #bbb; stroke-width: 1; stroke-dasharray: 4 3" />
            <g id="km-control">
          <path d="M 110.0,80.0 L 200.0,80.0 L 200.0,106.4 L 290.0,106.4 L 290.0,143.8 L 380.0,143.8 L 380.0,190.0 L 470.0,190.0 L 470.0,209.8 L 560.0,209.8 L 560.0,225.2 L 650.0,225.2 L 650.0,236.2" style="fill: none; stroke: #c44e52; stroke-width: 2.5" />
            </g>
            <g id="km-treatment">
          <path d="M 110.0,80.0 L 200.0,80.0 L 200.0,91.0 L 290.0,91.0 L 290.0,110.8 L 380.0,110.8 L 380.0,126.2 L 470.0,126.2 L 470.0,126.2 L 560.0,126.2 L 560.0,141.6 L 650.0,141.6 L 650.0,150.4" style="fill: none; stroke: #4c72b0; stroke-width: 2.5" />
            </g>
            <g id="km-censor-marks">
          <line x1="560.0" y1="219.2" x2="560.0" y2="231.2" style="stroke: #c44e52; stroke-width: 2" />
          <line x1="470.0" y1="120.2" x2="470.0" y2="132.2" style="stroke: #4c72b0; stroke-width: 2" />
          <line x1="650.0" y1="144.4" x2="650.0" y2="156.4" style="stroke: #4c72b0; stroke-width: 2" />
            </g>
            <g id="axis_x">
          <text x="110.0" y="330" style="font: 12px sans-serif; text-anchor: middle">0</text>
          <text x="290.0" y="330" style="font: 12px sans-serif; text-anchor: middle">6</text>
          <text x="470.0" y="330" style="font: 12px sans-serif; text-anchor: middle">12</text>
          <text x="650.0" y="330" style="font: 12px sans-serif; text-anchor: middle">18</text>
              <text x="380" y="352" style="font: 13px sans-serif; text-anchor: middle">Months</text>
            </g>
            <g id="axis_y">
          <text x="98" y="304.0" style="font: 12px sans-serif; text-anchor: end">0.0</text>
          <text x="98" y="194.0" style="font: 12px sans-serif; text-anchor: end">0.5</text>
          <text x="98" y="84.0" style="font: 12px sans-serif; text-anchor: end">1.0</text>
            </g>
            <g id="chart-title">
              <text x="380" y="50" style="font: 16px sans-serif; text-anchor: middle">Overall Survival</text>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>

</html>
