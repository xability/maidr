<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>MAIDR ROC Curve Example — Two Classifiers</title>
</head>

<body>
  <div>
    <link rel="stylesheet" href="../dist/maidr.css" />
    <script type="text/javascript" src="../dist/maidr.js"></script>
    <div>
      <!--
        A ROC curve is a classifier's true positive rate against its false
        positive rate, one point per decision threshold, and it is read
        against the chance diagonal the chart draws dashed. Read as a plain
        line the two curves here would sound alike, because a line scales
        each series' pitch to its own range and both run from (0, 0) to
        (1, 1). Read as a ROC curve the pitch is the rate itself, the pan is
        the false positive rate, every point says its threshold and how far
        it sits above chance, and the description gives the area under each
        curve and the best operating point.

        Logistic regression declares no area, so it is measured from the
        points (0.896 by the trapezoid rule); random forest carries the area
        its producer computed. Alt+Shift+M reaches the best operating point,
        which for logistic regression is the threshold of 0.45.
      -->
      <svg xmlns="http://www.w3.org/2000/svg" width="720pt" height="480pt" viewBox="0 0 720 480" version="1.1"
        id="roc-classifiers" maidr='{&#10;  &quot;id&quot;: &quot;roc-classifiers&quot;,&#10;  &quot;subplots&quot;: [&#10;    [&#10;      {&#10;        &quot;id&quot;: &quot;roc-classifiers-subplot&quot;,&#10;        &quot;layers&quot;: [&#10;          {&#10;            &quot;id&quot;: &quot;roc-classifiers-layer&quot;,&#10;            &quot;type&quot;: &quot;roc&quot;,&#10;            &quot;title&quot;: &quot;ROC Curves of Two Classifiers&quot;,&#10;            &quot;axes&quot;: {&#10;              &quot;x&quot;: {&#10;                &quot;label&quot;: &quot;False positive rate&quot;&#10;              },&#10;              &quot;y&quot;: {&#10;                &quot;label&quot;: &quot;True positive rate&quot;&#10;              }&#10;            },&#10;            &quot;selectors&quot;: [&#10;              &quot;g[id=&#x27;roc-curves&#x27;] &gt; polyline:nth-of-type(1)&quot;,&#10;              &quot;g[id=&#x27;roc-curves&#x27;] &gt; polyline:nth-of-type(2)&quot;&#10;            ],&#10;            &quot;data&quot;: [&#10;              [&#10;                {&#10;                  &quot;x&quot;: 0,&#10;                  &quot;y&quot;: 0,&#10;                  &quot;threshold&quot;: 1,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.05,&#10;                  &quot;y&quot;: 0.55,&#10;                  &quot;threshold&quot;: 0.8,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.1,&#10;                  &quot;y&quot;: 0.75,&#10;                  &quot;threshold&quot;: 0.6,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.2,&#10;                  &quot;y&quot;: 0.86,&#10;                  &quot;threshold&quot;: 0.45,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.35,&#10;                  &quot;y&quot;: 0.93,&#10;                  &quot;threshold&quot;: 0.3,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.6,&#10;                  &quot;y&quot;: 0.98,&#10;                  &quot;threshold&quot;: 0.15,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 1,&#10;                  &quot;y&quot;: 1,&#10;                  &quot;threshold&quot;: 0,&#10;                  &quot;z&quot;: &quot;Logistic regression&quot;&#10;                }&#10;              ],&#10;              [&#10;                {&#10;                  &quot;x&quot;: 0,&#10;                  &quot;y&quot;: 0,&#10;                  &quot;threshold&quot;: 1,&#10;                  &quot;z&quot;: &quot;Random forest&quot;,&#10;                  &quot;auc&quot;: 0.728&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.1,&#10;                  &quot;y&quot;: 0.4,&#10;                  &quot;threshold&quot;: 0.7,&#10;                  &quot;z&quot;: &quot;Random forest&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.25,&#10;                  &quot;y&quot;: 0.6,&#10;                  &quot;threshold&quot;: 0.5,&#10;                  &quot;z&quot;: &quot;Random forest&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.45,&#10;                  &quot;y&quot;: 0.78,&#10;                  &quot;threshold&quot;: 0.35,&#10;                  &quot;z&quot;: &quot;Random forest&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 0.7,&#10;                  &quot;y&quot;: 0.9,&#10;                  &quot;threshold&quot;: 0.2,&#10;                  &quot;z&quot;: &quot;Random forest&quot;&#10;                },&#10;                {&#10;                  &quot;x&quot;: 1,&#10;                  &quot;y&quot;: 1,&#10;                  &quot;threshold&quot;: 0,&#10;                  &quot;z&quot;: &quot;Random forest&quot;&#10;                }&#10;              ]&#10;            ]&#10;          }&#10;        ]&#10;      }&#10;    ]&#10;  ]&#10;}'>
        <g id="figure_1">
          <g id="figure-background">
            <path d="M 0 480  L 720 480  L 720 0  L 0 0  z " style="fill: #ffffff" />
          </g>
          <g id="axes_1">
            <g id="chance-line">
              <line x1="100" y1="420" x2="660" y2="60" style="stroke: #888888; stroke-width: 1; stroke-dasharray: 6 4" />
            </g>
            <g id="roc-curves">
              <polyline points="100,420 128.0,222.0 156.0,150.0 212.0,110.4 296.0,85.2 436.0,67.2 660,60" fill="none" style="stroke: #4c72b0; stroke-width: 3" />
              <polyline points="100,420 156.0,276.0 240.0,204.0 352.0,139.2 492.0,96.0 660,60" fill="none" style="stroke: #dd8452; stroke-width: 3" />
            </g>
            <g id="axis_x">
              <line x1="100" x2="660" y1="420" y2="420" style="stroke: #000000; stroke-width: 1" />
              <text x="100" y="440" style="font: 12px sans-serif; text-anchor: middle">0</text>
              <text x="240" y="440" style="font: 12px sans-serif; text-anchor: middle">0.25</text>
              <text x="380" y="440" style="font: 12px sans-serif; text-anchor: middle">0.5</text>
              <text x="520" y="440" style="font: 12px sans-serif; text-anchor: middle">0.75</text>
              <text x="660" y="440" style="font: 12px sans-serif; text-anchor: middle">1</text>
              <text x="380" y="465" style="font: 13px sans-serif; text-anchor: middle">False positive rate</text>
            </g>
            <g id="axis_y">
              <line x1="100" x2="100" y1="60" y2="420" style="stroke: #000000; stroke-width: 1" />
              <text x="90" y="424" style="font: 12px sans-serif; text-anchor: end">0</text>
              <text x="90" y="334" style="font: 12px sans-serif; text-anchor: end">0.25</text>
              <text x="90" y="244" style="font: 12px sans-serif; text-anchor: end">0.5</text>
              <text x="90" y="154" style="font: 12px sans-serif; text-anchor: end">0.75</text>
              <text x="90" y="64" style="font: 12px sans-serif; text-anchor: end">1</text>
              <text x="30" y="240" transform="rotate(-90 30 240)" style="font: 13px sans-serif; text-anchor: middle">True positive rate</text>
            </g>
            <g id="legend">
              <line x1="470" y1="380" x2="500" y2="380" style="stroke: #4c72b0; stroke-width: 3" />
              <text x="508" y="384" style="font: 12px sans-serif">Logistic regression</text>
              <line x1="470" y1="400" x2="500" y2="400" style="stroke: #dd8452; stroke-width: 3" />
              <text x="508" y="404" style="font: 12px sans-serif">Random forest</text>
            </g>
            <g id="chart-title">
              <text x="380" y="35" style="font: 16px sans-serif; text-anchor: middle">ROC Curves of Two Classifiers</text>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>

</html>
