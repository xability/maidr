      <!--
        A SUNBURST and an ICICLE carry the same hierarchy a treemap does, laid
        out differently: rings around a centre, and depth-ordered bands. The
        layout differs and the tree does not, so one trace reads all three and
        the keys are the same everywhere -- up to the parent, down into the
        first child, left and right across the siblings.

        WHAT AN ICICLE ASKS FOR is the band: it is drawn as a full row of
        blocks per depth, so "everything at this level, in layout order" is a
        question its layout puts directly. That goes on the LEVEL ROTOR rather
        than on the arrow keys. The arrows stay the tree -- a step past the
        last child of a parent is refused rather than landing in a cousin's
        subtree unannounced -- because one data model with two different arrow
        semantics, chosen by which layout the producer happened to pick, would
        be worse for a reader who meets both than one semantics plus a mode.

        As on the treemap, only the ten leaves are declared.
      -->

ath&quot;: [&#10;                  &quot;Asia&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Indonesia&quot;,&#10;                &quot;y&quot;: 278,&#10;                &quot;path&quot;: [&#10;                  &quot;Asia&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Japan&quot;,&#10;                &quot;y&quot;: 124,&#10;                &quot;path&quot;: [&#10;                  &quot;Asia&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Nigeria&quot;,&#10;                &quot;y&quot;: 224,&#10;                &quot;path&quot;: [&#10;                  &quot;Africa&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Ethiopia&quot;,&#10;                &quot;y&quot;: 127,&#10;                &quot;path&quot;: [&#10;                  &quot;Africa&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Egypt&quot;,&#10;                &quot;y&quot;: 113,&#10;                &quot;path&quot;: [&#10;                  &quot;Africa&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Russia&quot;,&#10;                &quot;y&quot;: 144,&#10;                &quot;path&quot;: [&#10;                  &quot;Europe&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;Germany&quot;,&#10;                &quot;y&quot;: 83,&#10;                &quot;path&quot;: [&#10;                  &quot;Europe&quot;&#10;                ]&#10;              },&#10;              {&#10;                &quot;x&quot;: &quot;France&quot;,&#10;                &quot;y&quot;: 68,&#10;                &quot;path&quot;: [&#10;                  &quot;Europe&quot;&#10;                ]&#10;
