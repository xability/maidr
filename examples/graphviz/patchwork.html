<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MAIDR + Graphviz Patchwork Treemap Example</title>
    <script src="../../dist/maidr.js"></script>
    <script src="../../dist/graphviz.js"></script>
  </head>
  <body>
    <h1>MAIDR + Graphviz Patchwork Treemap</h1>
    <p>Click on the diagram and use the arrow keys. Left and right move between the parts of one group, down opens a group and up leaves it. Press 'b' for braille, 't' for text descriptions.</p>

    <!--
      Drawn ahead of time by Graphviz (patchwork -Tsvg) from:

      graph Budget {
        label="Team budget";
        layout=patchwork;
        node [style=filled, fillcolor="#dbe9f6"];
        subgraph cluster_people {
          salaries [label="Salaries", area=60];
          training [label="Training", area=5];
        }
        subgraph cluster_infrastructure {
          cloud [label="Cloud", area=20];
          laptops [label="Laptops", area=8];
        }
        travel [label="Travel", area=7];
      }
    -->
    <div id="diagram">
      <svg width="324pt" height="349pt"
       viewBox="0.00 0.00 324.00 349.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 345.03)">
      <title>Budget</title>
      <polygon fill="white" stroke="none" points="-4,4 -4,-345.03 320.23,-345.03 320.23,4 -4,4"/>
      <text xml:space="preserve" text-anchor="middle" x="158.11" y="-8.2" font-family="Times,serif" font-size="14.00">Team budget</text>
      <g id="clust1" class="cluster">
      <title>cluster_people</title>
      <polygon fill="none" stroke="black" points="0,-135.48 0,-341.03 316.23,-341.03 316.23,-135.48 0,-135.48"/>
      </g>
      <g id="clust2" class="cluster">
      <title>cluster_infrastructure</title>
      <polygon fill="none" stroke="black" points="0,-24.8 0,-135.48 252.98,-135.48 252.98,-24.8 0,-24.8"/>
      </g>
      <!-- salaries -->
      <g id="node1" class="node">
      <title>salaries</title>
      <polygon fill="#dbe9f6" stroke="black" points="291.9,-341.03 0,-341.03 0,-135.48 291.9,-135.48 291.9,-341.03"/>
      <text xml:space="preserve" text-anchor="middle" x="145.95" y="-234.05" font-family="Times,serif" font-size="14.00">Salaries</text>
      </g>
      <!-- training -->
      <g id="node2" class="node">
      <title>training</title>
      <polygon fill="#dbe9f6" stroke="black" points="316.23,-341.03 291.9,-341.03 291.9,-135.48 316.23,-135.48 316.23,-341.03"/>
      <text xml:space="preserve" text-anchor="middle" x="304.07" y="-234.05" font-family="Times,serif" font-size="14.00">Training</text>
      </g>
      <!-- cloud -->
      <g id="node3" class="node">
      <title>cloud</title>
      <polygon fill="#dbe9f6" stroke="black" points="180.7,-135.48 0,-135.48 0,-24.8 180.7,-24.8 180.7,-135.48"/>
      <text xml:space="preserve" text-anchor="middle" x="90.35" y="-75.94" font-family="Times,serif" font-size="14.00">Cloud</text>
      </g>
      <!-- laptops -->
      <g id="node4" class="node">
      <title>laptops</title>
      <polygon fill="#dbe9f6" stroke="black" points="252.98,-135.48 180.7,-135.48 180.7,-24.8 252.98,-24.8 252.98,-135.48"/>
      <text xml:space="preserve" text-anchor="middle" x="216.84" y="-75.94" font-family="Times,serif" font-size="14.00">Laptops</text>
      </g>
      <!-- travel -->
      <g id="node5" class="node">
      <title>travel</title>
      <polygon fill="#dbe9f6" stroke="black" points="316.23,-135.48 252.98,-135.48 252.98,-24.8 316.23,-24.8 316.23,-135.48"/>
      <text xml:space="preserve" text-anchor="middle" x="284.61" y="-75.94" font-family="Times,serif" font-size="14.00">Travel</text>
      </g>
      </g>
      </svg>
      
    </div>

    <script>
      maidrGraphviz.bindGraphviz(document.getElementById('diagram'), { layout: 'patchwork', nodeLabel: 'Item' });
    </script>
  </body>
</html>
