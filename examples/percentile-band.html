        Distributions dashboard draws a layer's weights: at each training step,
        nine quantiles of the distribution -- the minimum, the 6.68th, 15.87th
        and 30.85th percentiles, the median, the 69.15th, 84.13th and 93.32nd,
        and the maximum -- as four nested shaded bands around the median line.

        The reader enters on the median and walks the steps with the left and
        right arrows; up and down step from quantile to quantile. Each point
        says the median and the band around it ("Middle 68% is -0.31 to
        0.35"), and the description says the spread widens most from step 100
        to 200 and narrows most from 200 to 300.

        `selectors` names one polygon per band, outermost first, and then the
        median's line.
