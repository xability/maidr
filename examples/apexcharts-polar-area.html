<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexCharts Polar Area Chart - MAIDR Example</title>
    <!-- ApexCharts v7.6.0, pinned with a subresource-integrity hash. The adapter
         reads the SVG ApexCharts draws, so its selectors are specific to this
         version: if upgrading, check the class names still match. -->
    <script
      src="https://cdn.jsdelivr.net/npm/apexcharts@7.6.0/dist/apexcharts.min.js"
      integrity="sha384-Ls3fJ2jLsgACMhjCwK+p72wydwr/C7GumKDeCkHRsLO0pOz2ThKSSVmS3qsY4v52"
      crossorigin="anonymous"
    ></script>
    <!-- MAIDR core + ApexCharts adapter -->
    <script src="../dist/maidr.js"></script>
    <script src="../dist/apexcharts.js"></script>
  </head>

  <body>
    <main>
      <h1>ApexCharts Polar Area Chart with MAIDR</h1>
      <p>
        Hours of sunshine by season, drawn as an ApexCharts polar area
        chart: each wedge has the same angle, and its length is the
        value.
      </p>
      <p id="error" hidden>
        Failed to load ApexCharts from CDN. Please check your internet
        connection.
      </p>
      <div id="chart" style="max-width: 760px"></div>
    </main>

    <script>
      // Surface an error if ApexCharts failed to load from CDN; otherwise draw
      // the chart and hand it to the MAIDR adapter.
      const errorEl = document.getElementById('error');
      if (typeof ApexCharts === 'undefined') {
        errorEl.hidden = false;
      } else {
        // ApexCharts' own keyboard navigation (chart.accessibility) would fight
        // MAIDR for the arrow keys, so it is switched off; MAIDR provides the
        // keyboard access instead. The toolbar is hidden too: its buttons would
        // be Tab stops inside MAIDR's chart, and zooming or panning leaves
        // points undrawn, which MAIDR can then read but not highlight.
        const options = {
          chart: { type: 'polarArea', height: 420, accessibility: { enabled: false }, toolbar: { show: false } },
          title: { text: 'Average Daily Sunshine by Season' },
          series: [5.2, 8.9, 9.6, 6.1],
          labels: ['Spring', 'Summer', 'Autumn', 'Winter'],
          yaxis: { title: { text: 'Hours' } },
        };

        const chart = new ApexCharts(document.querySelector('#chart'), options);
        chart.render();

        // bindApexCharts waits for ApexCharts to finish drawing, converts the
        // chart and hands it to MAIDR -- and does so again whenever ApexCharts
        // redraws it (a resize, updateSeries, a legend toggle).
        // The chart has no title for these axes, so the binding names what
        // MAIDR announces for them.
        maidrApexCharts.bindApexCharts(chart, { id: 'apexcharts-polar-area', axes: { x: 'Season' } });
      }
    </script>
  </body>
</html>
