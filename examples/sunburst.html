      <!--
        A SUNBURST and an ICICLE carry the same hierarchy a treemap does, laid
        out differently: rings around a centre, and depth-ordered bands. The
        layout differs and the tree does not, so one trace reads all three and
        the keys are the same everywhere -- up to the parent, down into the
        first child, left and right across the siblings.

        WHAT IS THE SUNBURST'S OWN is that its rings are angular. A node's
        children divide its arc in proportion to their values, so the sound is
        panned around the dial the way a pie's is: sweeping a ring goes out to
        one side and comes back, which is what distinguishes a circle from a
        row. The angle is derived from the tree rather than declared -- it is
        the layout, computed the way the chart was drawn.

        As on the treemap, only the ten leaves are declared. The three
        continents exist because the leaves named them.
      -->
