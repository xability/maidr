<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>MAIDR Rug Plot Example — Response Latency</title>
</head>

<body>
  <div>
    <link rel="stylesheet" href="../dist/maidr.css" />
    <script type="text/javascript" src="../dist/maidr.js"></script>
    <div>
      <!--
        A rug marks each observation as a tick on one axis, and is drawn to
        show where the observations fall and where they bunch up. It has one
        quantity per observation -- its position -- so that is what every
        channel carries: the pitch and the pan follow the position on the
        axis, the braille is the observation count per bin along it, and the
        text names the position and which observation it is in order.

        Twelve observations, listed in the order they were collected rather
        than sorted, with six bunched below 2.5 seconds, a few strung out
        across the middle, and two at 9.4. The axis is declared with a
        tickStep so the braille bins line up with the axis ticks the chart
        draws.
      -->
      <svg xmlns="http://www.w3.org/2000/svg" width="720pt" height="240pt" viewBox="0 0 720 240" version="1.1"
        id="rug-latency" maidr='{&#10;  &quot;id&quot;: &quot;rug-latency&quot;,&#10;  &quot;subplots&quot;: [&#10;    [&#10;      {&#10;        &quot;id&quot;: &quot;rug-latency-subplot&quot;,&#10;        &quot;layers&quot;: [&#10;          {&#10;            &quot;id&quot;: &quot;rug-latency-layer&quot;,&#10;            &quot;type&quot;: &quot;rug&quot;,&#10;            &quot;title&quot;: &quot;Response Latency&quot;,&#10;            &quot;axes&quot;: {&#10;              &quot;x&quot;: {&#10;                &quot;label&quot;: &quot;Seconds&quot;,&#10;                &quot;min&quot;: 0,&#10;                &quot;max&quot;: 10,&#10;                &quot;tickStep&quot;: 2.5&#10;              }&#10;            },&#10;            &quot;selectors&quot;: &quot;g[id=&#x27;rug-marks&#x27;] &gt; line&quot;,&#10;            &quot;data&quot;: [&#10;              { &quot;x&quot;: 2.2 },&#10;              { &quot;x&quot;: 1.5 },&#10;              { &quot;x&quot;: 9.4 },&#10;              { &quot;x&quot;: 1.7 },&#10;              { &quot;x&quot;: 6.5 },&#10;              { &quot;x&quot;: 2.0 },&#10;              { &quot;x&quot;: 3.1 },&#10;              { &quot;x&quot;: 9.4 },&#10;              { &quot;x&quot;: 1.2 },&#10;              { &quot;x&quot;: 4.8 },&#10;              { &quot;x&quot;: 6.7 },&#10;              { &quot;x&quot;: 2.3 }&#10;            ]&#10;          }&#10;        ]&#10;      }&#10;    ]&#10;  ]&#10;}'>
        <g id="figure_1">
          <g id="figure-background">
            <path d="M 0 240  L 720 240  L 720 0  L 0 0  z " style="fill: #ffffff" />
          </g>
          <g id="axes_1">
            <g id="rug-marks">
              <line x1="232" x2="232" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="190" x2="190" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="664" x2="664" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="202" x2="202" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="490" x2="490" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="220" x2="220" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="286" x2="286" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="664" x2="664" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="172" x2="172" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="388" x2="388" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="502" x2="502" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
              <line x1="238" x2="238" y1="120" y2="160" style="stroke: #4c72b0; stroke-width: 1.5" />
            </g>
            <g id="axis_x">
              <line x1="100" x2="700" y1="160" y2="160" style="stroke: #000000; stroke-width: 1" />
              <text x="100" y="185" style="font: 12px sans-serif; text-anchor: middle">0</text>
              <text x="250" y="185" style="font: 12px sans-serif; text-anchor: middle">2.5</text>
              <text x="400" y="185" style="font: 12px sans-serif; text-anchor: middle">5</text>
              <text x="550" y="185" style="font: 12px sans-serif; text-anchor: middle">7.5</text>
              <text x="700" y="185" style="font: 12px sans-serif; text-anchor: middle">10</text>
              <text x="400" y="215" style="font: 13px sans-serif; text-anchor: middle">Seconds</text>
            </g>
            <g id="chart-title">
              <text x="400" y="60" style="font: 16px sans-serif; text-anchor: middle">Response Latency</text>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>

</html>
