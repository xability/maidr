<!doctype html>
<html lang="en">
  <!--
  What maidr's Quarto extension (`_extensions/maidr/maidr.lua`) writes into a
  page that a Jupyter render has also put require.js on: maidr.js and then
  observable.js, after require.js and the named module Quarto defines inline.
  Any Python document with `ojs_define` is such a page. `window.requireLater`
  is the page's next `require()`.
-->

  <head>
    <meta charset="utf-8" />
    <title>maidr's Quarto extension under require.js (regression fixture)</title>
    <script src="require.min.js"></script>
    <script>
      define('jquery', [], function () {
        return { stand_in: 'jquery' };
      });
    </script>
    <script src="../../../dist/maidr.js"></script>
    <script src="../../../dist/observable.js"></script>
  </head>

  <body>
    <p>maidr.js and observable.js, loaded after require.js.</p>
    <script src="require-later.js"></script>
  </body>
</html>
