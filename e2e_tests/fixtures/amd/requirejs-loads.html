<!doctype html>
<html lang="en">
  <!--
  require.js 2.3.6 (see README.md) and the named module Quarto defines inline,
  with no adapter loaded by a script tag: the spec has require.js load them
  itself, through `window.requireLater`, under a `paths` alias and by URL --
  the way a page's own AMD code, a classic Jupyter `%%javascript` cell among
  them, pulls a UMD file in.

  Built as rolldown's UMD, each made an anonymous define, which require.js
  named after the module it was loading, so these loads resolved to the
  exports. A registration under the import path alone would leave them
  `undefined`, or "No define call" under `enforceDefine`.
-->

  <head>
    <meta charset="utf-8" />
    <title>Adapters loaded by require.js (regression fixture)</title>
    <script src="require.min.js"></script>
    <script>
      define('jquery', [], function () {
        return { stand_in: 'jquery' };
      });
    </script>
  </head>

  <body>
    <p>Nothing but require.js; the spec loads the adapters through it.</p>
    <script src="require-later.js"></script>
  </body>
</html>
