<!doctype html>
<html lang="en">
  <!--
  require.js 2.3.6 (see README.md) and the named module Quarto defines inline,
  then a chart, with none of maidr's scripts loaded by a script tag: the specs
  have require.js load them itself, through `window.requireLater`, under a
  `paths` alias and by URL -- the way a page's own AMD code, a classic Jupyter
  `%%javascript` cell among them, pulls a script in.

  Built as UMD, each made an anonymous define, which require.js named after
  the module it was loading, so these loads resolved. A registration under the
  import path alone would leave them `undefined`, or fail "No define call"
  under `enforceDefine`.
-->

  <head>
    <meta charset="utf-8" />
    <title>maidr loaded by require.js (regression fixture)</title>
    <script src="require.min.js"></script>
    <script>
      define('jquery', [], function () {
        return { stand_in: 'jquery' };
      });
    </script>
    <link rel="stylesheet" href="../../../dist/maidr.css" />
  </head>

  <body>
    <svg
      id="amd-host-bars"
      xmlns="http://www.w3.org/2000/svg"
      width="400"
      height="300"
      viewBox="0 0 400 300"
      maidr='{"id":"amd-host-bars","title":"Fruit sold","subplots":[[{"layers":[{"id":"amd-host-layer","type":"bar","axes":{"x":{"label":"Fruit"},"y":{"label":"Boxes"}},"data":[{"x":"Apples","y":12},{"x":"Bananas","y":7},{"x":"Cherries","y":9}],"selectors":"#amd-host-marks > rect"}]}]]}'
    >
      <g id="amd-host-marks">
        <rect x="40" y="60" width="80" height="240" style="fill: #4477aa" />
        <rect x="160" y="160" width="80" height="140" style="fill: #4477aa" />
        <rect x="280" y="120" width="80" height="180" style="fill: #4477aa" />
      </g>
    </svg>
    <script src="require-later.js"></script>
  </body>
</html>
