<!doctype html>
<html lang="en">
  <!--
  Fixture for walking values tied at an extreme with the bracket keys.

  Every chart in `examples/` has a single highest and single lowest value, so
  none of them can show what happens when a value is shared: pressing `]` on
  them lands once and has nowhere further to go. This row is built so both
  ends are tied — 90 appears three times and 10 twice — which is what makes
  the step-and-wrap behaviour, and the "n of m" it announces, observable.

  It lives here rather than in `examples/` because it demonstrates a keyboard
  behaviour rather than a chart type, and would only be noise in the published
  gallery.
-->

  <head>
    <meta charset="utf-8" />
    <title>Tied extremes (keyboard fixture)</title>
    <link rel="stylesheet" href="../../dist/maidr.css" />
    <script type="text/javascript" src="../../dist/maidr.js"></script>
  </head>

  <body>
    <svg
      id="tied-extremes"
      xmlns="http://www.w3.org/2000/svg"
      width="400"
      height="200"
      viewBox="0 0 400 200"
      version="1.1"
      maidr-data='{"id":"tied-extremes","title":"Tied extremes","subplots":[[{"id":"sp-tied","selector":"#bars > rect","layers":[{"id":"layer-tied","type":"bar","title":"Tied extremes","axes":{"x":{"label":"Slot"},"y":{"label":"Value"}},"data":[{"x":"A","y":90},{"x":"B","y":10},{"x":"C","y":90},{"x":"D","y":50},{"x":"E","y":90},{"x":"F","y":10}],"selectors":"#bars > rect"}]}]]}'
    >
      <g id="bars">
        <rect x="10" y="20" width="40" height="180" style="fill: #4477aa" />
        <rect x="70" y="180" width="40" height="20" style="fill: #4477aa" />
        <rect x="130" y="20" width="40" height="180" style="fill: #4477aa" />
        <rect x="190" y="100" width="40" height="100" style="fill: #4477aa" />
        <rect x="250" y="20" width="40" height="180" style="fill: #4477aa" />
        <rect x="310" y="180" width="40" height="20" style="fill: #4477aa" />
      </g>
    </svg>
  </body>
</html>
